# monitoring/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    cluster: 'credit-bureau-prod'

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'credit-decision-api'
    metrics_path: '/metrics'
    scheme: 'http'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - production
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: credit-decision-api
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance